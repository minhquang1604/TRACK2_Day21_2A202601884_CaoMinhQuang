name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chay unit tests tren du lieu ao (khong can ket noi cloud storage).
  # Neu co bat ky test nao that bai, pipeline dung lai o day va khong tien hanh
  # huan luyen hay trien khai.
  # ---------------------------------------------------------------------------
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Xac thuc AWS, pull du lieu bang DVC (remote S3), huan luyen mo hinh, upload
  # artifact len S3.
  # Chi chay khi Job 1 (Unit Test) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        # STORAGE_CREDENTIALS chua JSON: {"aws_access_key_id": "...", "aws_secret_access_key": "..."}
        # Parse va ghi thanh bien moi truong AWS chuan de ca dvc va boto3 tu dong doc duoc.
        env:
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
        run: |
          python -c "
          import json, os
          creds = json.loads(os.environ['STORAGE_CREDENTIALS'])
          key_id = creds['aws_access_key_id']
          secret = creds['aws_secret_access_key']
          # QUAN TRONG: gia tri parse tu JSON KHONG duoc GitHub tu dong che trong
          # log (chi gia tri secrets.X nguyen goc moi duoc che). Phai tu them mask.
          print(f'::add-mask::{key_id}')
          print(f'::add-mask::{secret}')
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'AWS_ACCESS_KEY_ID={key_id}\n')
              f.write(f'AWS_SECRET_ACCESS_KEY={secret}\n')
          "

      - name: Pull data with DVC
        # Chi pull train_batch1.csv va holdout.csv (khong can train_batch2.csv o Buoc 2).
        run: dvc pull data/train_batch1.csv data/holdout.csv

      - name: Point MLflow to DagsHub remote (Bonus 1)
        # MLflow client tu doc 3 bien moi truong chuan nay de tracking + auth
        # (HTTP basic auth) voi server DagsHub, khong can sua src/train.py.
        env:
          DAGSHUB_MLFLOW_URI: ${{ secrets.DAGSHUB_MLFLOW_URI }}
          DAGSHUB_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          echo "MLFLOW_TRACKING_URI=$DAGSHUB_MLFLOW_URI" >> $GITHUB_ENV
          echo "MLFLOW_TRACKING_USERNAME=$DAGSHUB_USERNAME" >> $GITHUB_ENV
          echo "MLFLOW_TRACKING_PASSWORD=$DAGSHUB_TOKEN" >> $GITHUB_ENV

      - name: Train model
        run: python src/train.py

      - name: Read report
        id: read_report
        run: |
          F1=$(python -c "import json; d=json.load(open('outputs/report.json')); print(d['f1_score'])")
          echo "f1=$F1" >> $GITHUB_OUTPUT

      - name: Upload model to Cloud Storage (staging)
        # Bonus 4: upload vao artifacts/staging/ truoc, CHUA ghi de artifacts/current/.
        # Job rollback-guard se so sanh voi model dang chay roi moi "promote" sang current/.
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          python - <<'PYEOF'
          import boto3
          import os

          bucket = os.environ["ARTIFACT_BUCKET"]
          client = boto3.client("s3")
          client.upload_file("models/model.joblib", bucket, "artifacts/staging/model.joblib")
          client.upload_file("outputs/report.json", bucket, "artifacts/staging/report.json")
          print(f"Model + report uploaded to s3://{bucket}/artifacts/staging/")
          PYEOF

      - name: Save report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: |
            outputs/report.json
            outputs/detail.txt

  # ---------------------------------------------------------------------------
  # JOB 3 - QUALITY GATE
  # Kiem tra nguong chat luong (f1_score >= 0.65).
  # Pipeline dung lai o day neu mo hinh chua dat yeu cau.
  #
  # Luu y: nguong o day dat tren f1_score chu KHONG phai accuracy. Bo du lieu
  # Adult co ty le lop 75/25, nen mot mo hinh doan bua "thu nhap thap" cho moi
  # mau da dat accuracy 0.75 ma hoan toan vo dung.
  # Chi chay khi Job 2 (Train) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Check quality gate
        run: |
          python - <<'PYEOF'
          f1 = float("${{ needs.train.outputs.f1 }}")
          if f1 < 0.65:
              raise SystemExit(f"FAILED: f1_score {f1:.4f} < 0.65. Huy trien khai.")
          print(f"PASSED: f1_score {f1:.4f} >= 0.65. Dang trien khai model.")
          PYEOF


  # ---------------------------------------------------------------------------
  # JOB 4 - ROLLBACK GUARD (Bonus 4)
  # So sanh f1_score cua model moi (artifacts/staging/) voi model dang chay
  # (artifacts/current/). Chi "promote" (ghi de current/) khi f1 moi >= f1 cu,
  # hoac khi chua co model nao dang chay (lan trien khai dau tien).
  # Chi chay khi Job 3 (Quality Gate) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  rollback-guard:
    name: Rollback Guard
    needs: [train, quality-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Cloud Storage
        env:
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
        run: |
          python -c "
          import json, os
          creds = json.loads(os.environ['STORAGE_CREDENTIALS'])
          key_id = creds['aws_access_key_id']
          secret = creds['aws_secret_access_key']
          # QUAN TRONG: gia tri parse tu JSON KHONG duoc GitHub tu dong che trong
          # log (chi gia tri secrets.X nguyen goc moi duoc che). Phai tu them mask.
          print(f'::add-mask::{key_id}')
          print(f'::add-mask::{secret}')
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'AWS_ACCESS_KEY_ID={key_id}\n')
              f.write(f'AWS_SECRET_ACCESS_KEY={secret}\n')
          "

      - name: Compare with currently deployed model and promote if not worse
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
          NEW_F1: ${{ needs.train.outputs.f1 }}
        run: |
          python - <<'PYEOF'
          import boto3
          import json
          import os
          from botocore.exceptions import ClientError

          bucket = os.environ["ARTIFACT_BUCKET"]
          new_f1 = float(os.environ["NEW_F1"])
          client = boto3.client("s3")

          old_f1 = None
          try:
              obj = client.get_object(Bucket=bucket, Key="artifacts/current/report.json")
              old_f1 = json.loads(obj["Body"].read())["f1_score"]
          except ClientError as e:
              if e.response["Error"]["Code"] in ("NoSuchKey", "404"):
                  print("Chua co model nao dang chay (lan trien khai dau tien).")
              else:
                  raise

          if old_f1 is not None:
              print(f"So sanh: f1 moi = {new_f1:.4f} | f1 dang chay = {old_f1:.4f}")
              if new_f1 < old_f1:
                  raise SystemExit(
                      f"FAILED: f1 moi ({new_f1:.4f}) thap hon f1 dang chay "
                      f"({old_f1:.4f}). Huy promote, giu nguyen model cu."
                  )
              print("PASSED: f1 moi khong thap hon f1 dang chay. Promote model moi.")
          else:
              print(f"PASSED: khong co model cu de so sanh. Promote model moi (f1={new_f1:.4f}).")

          for name in ("model.joblib", "report.json"):
              client.copy_object(
                  Bucket=bucket,
                  CopySource={"Bucket": bucket, "Key": f"artifacts/staging/{name}"},
                  Key=f"artifacts/current/{name}",
              )
          print(f"Da promote artifacts/staging/ -> artifacts/current/ tren s3://{bucket}")
          PYEOF


  # ---------------------------------------------------------------------------
  # JOB 5 - RELEASE
  # Trien khai len VM qua SSH.
  # Chi chay khi Job 4 (Rollback Guard) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  release:
    name: Release
    needs: rollback-guard
    runs-on: ubuntu-latest
    steps:

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo systemctl restart income-api
            sleep 5
            for i in 1 2 3 4 5; do
              if curl -sf http://localhost:8080/healthz; then
                echo "Health check passed."
                exit 0
              fi
              sleep 3
            done
            echo "Health check failed after retries."
            exit 1
